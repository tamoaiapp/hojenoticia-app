name: Daily Update

on:
  schedule:
    # GitHub usa UTC: 01:20 UTC = 22:20 BRT do dia anterior.
    # Os horários agendados são de melhores esforços, sujeitos a atrasos.
    - cron: '20 1 * * *'
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily update (no auto-push — workflow handles git)
        id: update
        continue-on-error: true
        run: node scripts/daily-update.mjs --no-push

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "auto: daily-update $DATE"
            git push
          fi

      - name: Report updater failures
        if: steps.update.outcome == 'failure'
        run: exit 1
