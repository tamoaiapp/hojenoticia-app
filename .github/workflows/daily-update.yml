name: Daily Update

on:
  schedule:
    # GitHub usa UTC: 01:20 UTC = 22:20 BRT do dia anterior.
    # Os horários agendados são de melhores esforços, sujeitos a atrasos.
    - cron: '20 1 * * *'
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test exchange-rate updater
        run: node --test scripts/modules/cambio.test.mjs scripts/modules/cambio-fallback.test.mjs scripts/modules/cambio-recovery.test.mjs

      - name: Test lottery updater and failure reporting
        run: node --test scripts/modules/loterias.test.mjs scripts/daily-update.test.mjs

      - name: Test calendar rules and idempotent content updates
        run: node --test scripts/holiday-calendar.test.mjs scripts/resultados-following.test.mjs scripts/modules/horoscopo.test.mjs

      - name: Run daily update (no auto-push — workflow handles git)
        id: update
        continue-on-error: true
        env:
          AWESOMEAPI_KEY: ${{ secrets.AWESOMEAPI_KEY }}
        run: node scripts/daily-update.mjs --no-push

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "auto: daily-update $DATE"
            git push
          fi

      - name: Report updater failures
        if: steps.update.outcome == 'failure'
        env:
          FAILED_MODULES: ${{ steps.update.outputs.failed_modules }}
        run: |
          echo "::error title=Atualização incompleta::Falha nos módulos: ${FAILED_MODULES:-consulte o log da atualização}. As alterações válidas foram preservadas."
          exit 1
